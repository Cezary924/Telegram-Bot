services:
  telegram-bot:
    build: .
    container_name: telegram-bot
    restart: always
    volumes:
      - ./:/app
    healthcheck:
      test: ["CMD-SHELL", "grep -qa bot.py /proc/*/cmdline"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
