ask:
  name: Write a name for the counter
  step: How much should one tap of plus or minus count? Write a number, like 10 or 0.5
  goal: Write the goal to reach before the next reset, like 8, or leave the counter without one
  period: When should the counter start from zero?
  amount: Write how much to add, like 5, or how much to take away, like -2
  when: When was it?
  week: Which day does your week start on?
wrong:
  amount: Write a number, like 5 or -2
  zero: Write a number other than zero
  too_much: Write a number between -{high} and {high}
  letter: A name needs at least one letter
  sign: A name cannot begin or end with a plus or minus and a number, as in Coffee +1
  taken: You already have a counter called {name}

add_sure: Count this?
missing: There is no counter with this name - check the list of the counters of the user

actions:
  add: Adds an amount to one of the counters of the user, or takes it away when negative. The user confirms it with a button
  list: Lists the counters of the user with the value since the last reset, the step, the goal and how often they start from zero
  history: Gives the latest entries of one counter of the user with their time
parameters:
  counter: The name of the counter, as the user calls it
  amount: How much to add, negative to take away
