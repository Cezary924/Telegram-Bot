context:
  recent: Ostatnie obliczenia

actions:
  convert: Zamienia wartość z jednostką na inną jednostkę albo, gdy jednostki nie podano, na każdą jednostkę tego rodzaju
  calculate: Dodaje i odejmuje wartości jednego rodzaju, jak 2 kg + 30 dag, 3 km - 800 m albo czasy trwania jak 1:20 + 2:45
  difference: Liczy czas między dwiema chwilami - gdy podano same godziny, a koniec jest wcześniej, kończy się następnego dnia
  shift: Podaje chwilę, która wypada jakiś czas po innej chwili albo przed nią, razem z dniem tygodnia
parameters:
  amount: Wartość z jednostką, jak 5 km, 300 g albo 90 min
  unit: Jednostka, na którą zamienić, jak m, lb albo h - pomiń, żeby dostać każdą jednostkę tego rodzaju
  expression: Działanie, jak 2 kg + 30 dag, 3 km - 800 m albo 1:20 + 2:45 + 0:35
  start: Pierwsza chwila, jak 21:30, 30.10 21:30 albo 2026-10-30 21:30 - pomiń, jeśli chodzi o teraz
  end: Druga chwila, zapisana tak samo - pomiń, jeśli chodzi o teraz
  duration: Ile czasu, jak 3 h 20 min, 1:20 albo 90 min
  is_subtracted: Prawda, żeby cofnąć się w czasie zamiast iść naprzód
