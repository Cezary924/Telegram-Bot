name: Kalkulator
description: Zamienia jednostki, liczy na nich i liczy czas

commands.calculator: Zamieniaj jednostki, licz na nich i licz czas

how: Aby coś obliczyć, wyślij mi działanie. Jednostki również nie są dla mnie problemem
history: Historia
entry: Obliczenie
remove: Usuń
previous: Poprzednia
next: Następna
pick: Wybierz obliczenie, żeby zobaczyć je jeszcze raz albo usunąć. Strona {page} z {pages}, łącznie {total}
no_history: Nic jeszcze nie zostało policzone
sure: Czy na pewno chcesz usunąć to obliczenie?
deleted: Obliczenie zostało usunięte
gone: Tego obliczenia już nie ma

wrong_amount: Napisz liczbę z jednostką, na przykład 5 km, 300 g albo 90 min
wrong_unit: Wybierz jedną z tych jednostek - {units}
wrong_expression: Napisz wartości z jednostkami połączone znakiem + albo -, na przykład 2 kg + 30 dag albo 1:20 + 2:45
mixed: Te jednostki do siebie nie pasują, trzymaj się długości, masy albo czasu
wrong_moment: Napisz godzinę, na przykład 21:30, albo datę z godziną, na przykład 30.10 21:30 lub 30.10.2026 21:30
wrong_duration: Napisz, ile to trwa, na przykład 3 h 20 min, 3h20m, 1:20 albo 90 min
too_long: To za długo, zmieść się w 100 latach

