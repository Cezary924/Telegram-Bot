how: Log your weight and keep track of how it changes
log: Log the weight
history: History
chart: Chart
settings_button: Settings
heights: Height history
chart_title: Weight over time
pick: Tap an entry to change or delete it. Page {page} of {pages}, {total} entries
previous: Previous
next: Next
entry: Entry
edit_value: Change the value
edit_when: Change the date and time
remove: Delete
empty:
  weight: No weight has been logged yet
  height: No height has been logged yet
saved: The weight has been logged
changed: The entry has been changed
unknown: not given
