  before: before that {value} ({day})
  first: first measured {value} ({day})

actions:
  log_weight: Logs a weight the user measured
  log_height: Logs a height the user measured
  history: Gives the logged weights and heights with their dates, oldest first
parameters:
  weight: The weight in kilograms - if the user gave pounds, convert them
  height: The height in centimetres - if the user gave feet and inches, convert them
