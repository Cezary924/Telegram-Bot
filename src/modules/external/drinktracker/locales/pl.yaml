parameters:
  kind: Rodzaj napoju - beer (piwo), strong_beer (mocne piwo), cider (cydr), wine (wino), shot (wódka), whisky albo custom, chyba że kontekst podaje inne zwykłe napoje użytkownika. Zwykłe napoje mają pojemność i moc z ustawień użytkownika
  volume: Ile mililitrów - pomiń przy standardowym napoju
  strength: Ile procent alkoholu - pomiń przy standardowym napoju
  when: Kiedy wypity, w formacie YYYY-MM-DD HH:MM - pomiń, jeśli właśnie teraz
  food: Ile użytkownik zjadł przed sesją - empty (pusty żołądek), little (trochę) albo meal (duży posiłek)
