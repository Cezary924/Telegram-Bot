actions:
  add_drink: Saves a drink the user had. The usual drinks have their own volume and strength, for your own give both
  days: Gives how much the user drank each day of the last two weeks
parameters:
  kind: The kind of drink - beer, strong_beer, cider, wine, shot (vodka), whisky or custom, unless the context gives other usual drinks of the user. The usual drinks take their volume and strength from the settings of the user
  volume: How many millilitres - leave it out for a usual drink
  strength: How many percent of alcohol - leave it out for a usual drink
  when: When it was drunk, as YYYY-MM-DD HH:MM - leave it out if it is right now
  food: How much the user ate before the session - empty, little or meal (a big meal)
