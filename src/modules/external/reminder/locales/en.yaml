name: Reminders
description: Reminds you about anything at the time you set

commands.reminder: Set and manage your reminders

title: Reminders
menu: Reminders you have set
set: Set a reminder
manage: Manage reminders

labels:
  content: Content
  date: Date
ask:
  content: Write what I should remind you about
  date: Write when I should remind you, for example {example} or just 21:30
wrong_date: I do not understand this date, write it like {example} or just 21:30
past_date: This moment has already passed, write a later one, like {example}

done: The reminder has been set
changed: The reminder has been changed
deleted: The reminder has been deleted
gone: This reminder is no longer there
empty: You have no reminders yet
pick:
  text: Pick the reminder you want to manage.
  page: Page {page} of {pages}, {total} in total
previous: Previous
next: Next

edit_content: Change the content
edit_date: Change the date
delete: Delete
sure: Do you really want to delete this reminder?

due: It is time!
delayed: It was time, but I could not reach you earlier.

add_sure: Do you want me to set this reminder?
edit_sure: Do you want me to change the reminder into this?
missing: There is no such reminder - it may have been deleted or the number is wrong
unchanged: Nothing to change - give a new content, a new date or both
upcoming: The next reminders
actions:
  add: Sets a reminder for the user, who confirms it with a button
  list: Lists the reminders of the user, the waiting ones first from the soonest, then the sent ones
  edit: Changes the content, the date or both of a reminder of the user, who confirms it with a button
  delete: Deletes a reminder of the user, who confirms it with a button
parameters:
  content: What to remind about, up to 200 characters
  date: When to remind, in the local time, as YYYY-MM-DD HH:MM or DD.MM.YYYY HH:MM
  reminder_id: The id of the reminder, from the list
