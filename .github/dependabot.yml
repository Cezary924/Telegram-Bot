version: 2
updates:
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/src/modules/*/*"
    schedule:
      interval: "daily"
    groups:
      every-copy:
        group-by: dependency-name
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
