name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check the code style
        run: pycodestyle src

      - name: Run the tests
        run: pytest --cov=src --cov-report=term-missing

  audit:
    name: Vulnerable dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit every requirements file
        run: |
          set --
          for file in $(find . -name 'requirements*.txt' | sort); do
            echo "auditing $file"
            set -- "$@" -r "$file"
          done
          pip-audit "$@"

  summary:
    name: Summary
    needs: [ tests, audit ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report what passed
        env:
          TESTS: ${{ needs.tests.result }}
          AUDIT: ${{ needs.audit.result }}
        run: |
          {
            echo "## CI summary"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for entry in "Tests|$TESTS" "Vulnerable dependencies|$AUDIT"; do
            name="${entry%|*}"
            result="${entry##*|}"
            if [ "$result" = "success" ]; then
              echo "| $name | ✅ $result |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $name | ❌ $result |" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done
          echo >> "$GITHUB_STEP_SUMMARY"
          if [ "$failed" = "1" ]; then
            echo "Something did not pass, so this cannot go in." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Everything passed." >> "$GITHUB_STEP_SUMMARY"

  report:
    name: Report a failed weekly run
    needs: [ tests, audit ]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update an issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: The weekly CI run failed
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(printf '%s\n\n%s\n' \
            "Tests: ${{ needs.tests.result }}. Vulnerable dependencies: ${{ needs.audit.result }}." \
            "$RUN")
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
          fi
